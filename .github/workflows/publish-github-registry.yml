# Fork (Haredev): publish the CLI and server stack to GitHub Packages
# (@haredev/paperclipai + @haredev/paperclip-*) on every push to master.
name: Publish to GitHub Registry

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: github-registry-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Version comes from the root package.json "packageManager" field.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@haredev"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Compute publish version and server alias
        run: |
          # Upstream versions releases by tag (vYYYY.MMDD.N); fall back to the
          # CLI manifest version when no release tag is reachable.
          BASE_VERSION=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null | sed 's/^v//' || true)
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION=$(node -p "require('./cli/package.json').version")
          fi
          PUBLISH_VERSION="${BASE_VERSION}-sha.${GITHUB_SHA:0:8}"
          echo "PUBLISH_VERSION=${PUBLISH_VERSION}" >> "$GITHUB_ENV"
          echo "PAPERCLIP_SERVER_NPM_SPECIFIER=npm:@haredev/paperclip-server@${PUBLISH_VERSION}" >> "$GITHUB_ENV"

      - name: Publish server stack (@haredev/paperclip-*)
        run: node scripts/publish-haredev-github-registry.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build CLI bundle
        run: ./scripts/build-npm.sh --skip-checks --skip-typecheck

      - name: Set package metadata for GitHub Registry
        run: |
          node --input-type=module -e "
            import { readFileSync, writeFileSync } from 'fs';
            const pkg = JSON.parse(readFileSync('./cli/package.json', 'utf8'));
            pkg.name = '@haredev/paperclipai';
            pkg.version = process.env.PUBLISH_VERSION;
            pkg.publishConfig = { registry: 'https://npm.pkg.github.com' };
            writeFileSync('./cli/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Publish CLI to GitHub Registry
        run: cd cli && npm publish --tag dev --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Job summary
        run: |
          {
            echo "### Published to GitHub Registry"
            echo ""
            echo "**CLI:** \`@haredev/paperclipai@${PUBLISH_VERSION}\`"
            echo "**Server (installed as \`@paperclipai/server\` via npm alias):** \`@haredev/paperclip-server@${PUBLISH_VERSION}\`"
            echo ""
            echo "Board UI is shipped inside the server package (\`server/ui-dist\` from \`prepack\`)."
            echo ""
            echo "To install, add to \`.npmrc\`:"
            echo "\`\`\`"
            echo "@haredev:registry=https://npm.pkg.github.com"
            echo "\`\`\`"
            echo "Then: \`npm install @haredev/paperclipai@dev\`"
          } >> "$GITHUB_STEP_SUMMARY"
